name: ci

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  kernel:
    name: atry 内核（门禁 + 测试 + 集成）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: atry/server
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: itroot
          MYSQL_DATABASE: atry_it
          MYSQL_USER: atry
          MYSQL_PASSWORD: atrypass
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      IT_DB_URL: jdbc:mysql://127.0.0.1:3306/atry_it?allowPublicKeyRetrieval=true&useSSL=false&allowMultiQueries=true
      IT_DB_USER: atry
      IT_DB_PASSWORD: atrypass
      IT_REDIS_HOST: 127.0.0.1
      IT_REDIS_PORT: 6379
      IT_REDIS_DATABASE: 15
      COS_SECRET_ID: ci-dummy
      COS_SECRET_KEY: ci-dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: 数据边界棘轮检查
        working-directory: atry
        run: python3 tools/table_access_inventory.py --baseline docs/generated/table-access-baseline.json
      - name: Flyway 迁移纪律
        working-directory: atry
        run: python3 tools/flyway_discipline.py --verify
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: 单元 + 架构测试
        run: mvn -B -ntp test
      - name: 集成测试
        run: mvn -B -ntp -Pintegration test
      - name: 安装内核到本地仓库（供 chatry 使用）
        run: mvn -B -ntp -DskipTests install

  app:
    name: chatry 垂直应用（后端 + 前端 + 文档）
    runs-on: ubuntu-latest
    needs: kernel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: 构建内核
        run: mvn -B -ntp -DskipTests install -f atry/server/pom.xml
      - name: 后端测试
        run: mvn -B -ntp test -f chatry/pom.xml
      - name: 打包
        run: mvn -B -ntp -DskipTests package -f chatry/pom.xml
      - name: 上传 jar
        uses: actions/upload-artifact@v4
        with:
          name: chatry-app-jar
          path: chatry/chatry-app/target/chatry-app-*-exec.jar
          if-no-files-found: error

  web:
    name: 前端构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chatry/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: chatry/web/package-lock.json
      - run: npm ci
      - run: npm run build

  docs:
    name: 文档门禁
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 关键文档存在性
        run: |
          test -f chatry/docs/payment-roadmap-p6-p10.md
          test -f chatry/docs/runbook-payment.md
          test -f chatry/docs/demo-payment-5min.md
          test -f chatry/docs/ai-layer-research-and-plan.md
          echo "docs ok"

  image:
    name: 内核镜像 + 漏洞扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 构建镜像
        run: docker build -t atry:${{ github.sha }} -f atry/server/Dockerfile atry/server
      - name: Trivy 扫描（CRITICAL，忽略未修复）
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db
          TRIVY_JAVA_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-java-db
        with:
          image-ref: atry:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL'
          vuln-type: 'os,library'
