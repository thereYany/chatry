name: ci

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: chatry
      # chatry 依赖 atry 内核（com.wherelee:atry-*），内核尚未发布到公共仓库，
      # CI 里按版本先构建安装一次，保证「垂直仓 + 对应内核版本」一起验证。
      - uses: actions/checkout@v7
        with:
          repository: thereYany/atry
          ref: main
          path: atry
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build & install atry kernel
        run: mvn -B -ntp -DskipTests install -f atry/server/pom.xml
      - name: Backend tests
        run: mvn -B -ntp test -f chatry/pom.xml
      - name: Package executable jar
        run: mvn -B -ntp -DskipTests package -f chatry/pom.xml
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: chatry-app-jar
          path: chatry/chatry-app/target/chatry-app-*-exec.jar
          if-no-files-found: error

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chatry/web
    steps:
      - uses: actions/checkout@v7
        with:
          path: chatry
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: chatry/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

  docs-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 检查路线图与运行手册存在（防止文档被误删）
        run: |
          test -f docs/payment-roadmap-p6-p10.md
          test -f docs/runbook-payment.md
          test -f docs/demo-payment-5min.md
          test -f docs/ai-layer-research-and-plan.md
          echo "docs ok"
