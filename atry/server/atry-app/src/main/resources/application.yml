server:
  port: 8084
  shutdown: graceful

spring:
  application:
    name: atry-base
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/atry_core?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 3000
      validation-timeout: 1000
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 2s
  flyway:
    enabled: true
    # 内核迁移可能晚于某条线新增（如 V101 晚于 V4xx/V5xx）；允许补跑，但版本号只增不复用。
    # 垂直应用（V9xx）升级内核时同样需要；CI 的迁移纪律检查在 P4 补。
    out-of-order: true
    # 内核表由各内核模块 jar 自带迁移；垂直应用在此基础上追加自己的 location
    locations: classpath:db/migration/platform,classpath:db/migration/identity,classpath:db/migration/payment,classpath:db/migration/llm,classpath:db/migration/metering
  task:
    scheduling:
      # 6 个 @Scheduled 任务共享调度线程：Spring Boot 默认 pool.size=1，慢任务（查单/对账/告警）
      # 会把其他定时任务全部堵住，导致告警与发件箱投递延迟；这里固定 4 个专属调度线程。
      pool:
        size: ${SCHEDULING_POOL_SIZE:4}
      thread-name-prefix: scheduling-

mybatis:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

app:
  tenant:
    # 生产必须 true：SQL 未带 tenant_id 条件时直接拒绝，避免"忘了加"的越权
    enforce: ${TENANT_ENFORCE:true}
    default-tenant-id: 0
    # 垂直应用通过 extra-tables 追加自己的租户表；内核表已内置
    extra-tables: []
  security:
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://127.0.0.1:5175,http://localhost:5175}
    trust-forwarded-headers: ${TRUST_FORWARDED_HEADERS:false}
    login-protection-enabled: ${LOGIN_PROTECTION_ENABLED:true}
    login-max-attempts: ${LOGIN_MAX_ATTEMPTS:8}
    login-ip-max-attempts: ${LOGIN_IP_MAX_ATTEMPTS:40}
    login-window-minutes: ${LOGIN_WINDOW_MINUTES:10}
  jwt:
    secret: ${JWT_SECRET:atry-demo-jwt-secret-change-before-production-2026}
    ttl-minutes: ${JWT_TTL_MINUTES:480}
    issuer: ${JWT_ISSUER:atry}
    audience: ${JWT_AUDIENCE:atry-web}
  storage:
    # 通用基座默认不假设接对象存储；需要媒体能力的垂直应用打开并配置 bucket/region/凭据
    enabled: ${STORAGE_ENABLED:false}
    bucket: ${COS_BUCKET:}
    region: ${COS_REGION:}
    url-ttl-minutes: ${STORAGE_URL_TTL_MINUTES:240}
    connect-timeout-ms: ${STORAGE_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${STORAGE_READ_TIMEOUT_MS:15000}
    max-retries: ${STORAGE_MAX_RETRIES:2}
    url-cache-margin-minutes: ${STORAGE_URL_CACHE_MARGIN_MINUTES:30}
  invitation:
    base-url: ${APP_BASE_URL:http://127.0.0.1:5175}
    expiry-hours: ${INVITE_EXPIRY_HOURS:72}
    max-attempts: ${INVITE_MAX_ATTEMPTS:20}
    window-minutes: ${INVITE_WINDOW_MINUTES:10}
  alert:
    enabled: ${ALERT_ENABLED:true}
    webhook-url: ${ALERT_WEBHOOK_URL:}
    dedup-minutes: ${ALERT_DEDUP_MINUTES:30}
    evaluate-interval-ms: ${ALERT_EVALUATE_INTERVAL_MS:300000}
    initial-delay-ms: ${ALERT_INITIAL_DELAY_MS:60000}
    payment-paid-unfulfilled-minutes: ${ALERT_PAYMENT_PAID_UNFULFILLED_MINUTES:1}
    payment-paying-stuck-minutes: ${ALERT_PAYMENT_PAYING_STUCK_MINUTES:15}
    payment-refund-retry-exhausted-threshold: ${ALERT_PAYMENT_REFUND_RETRY_EXHAUSTED_THRESHOLD:1}
  seed:
    # 留空则首次启动随机生成并打印一次；账号已存在时不会重置密码
    admin-password: ${SEED_ADMIN_PASSWORD:}
  payment:
    provider: ${PAYMENT_PROVIDER:mock}
    # 接入方应用标识（写入支付单 app_id，多业务方接入时区分来源）
    app-id: ${PAYMENT_APP_ID:atry}
    # 主动查单（无公网回调域名时的结算兜底）：定时轮询渠道状态
    query:
      enabled: ${PAYMENT_QUERY_ENABLED:true}
      interval-ms: ${PAYMENT_QUERY_INTERVAL_MS:30000}
      initial-delay-ms: ${PAYMENT_QUERY_INITIAL_DELAY_MS:15000}
      batch-size: ${PAYMENT_QUERY_BATCH_SIZE:20}
    outbox:
      reclaim-after-seconds: ${PAYMENT_OUTBOX_RECLAIM_AFTER_SECONDS:120}
    mock-enabled: ${PAYMENT_MOCK_ENABLED:true}
    mock-secret: ${PAYMENT_MOCK_SECRET:atry-mock-payment-secret-change-before-production}
    order-expire-minutes: ${PAYMENT_ORDER_EXPIRE_MINUTES:15}
    query-after-seconds: ${PAYMENT_QUERY_AFTER_SECONDS:15}
    reconcile-batch-size: ${PAYMENT_RECONCILE_BATCH_SIZE:20}
    reconcile-interval-ms: ${PAYMENT_RECONCILE_INTERVAL_MS:15000}
    reconcile-initial-delay-ms: ${PAYMENT_RECONCILE_INITIAL_DELAY_MS:10000}
    refund-max-attempts: ${PAYMENT_REFUND_MAX_ATTEMPTS:5}
    refund-retry-base-seconds: ${PAYMENT_REFUND_RETRY_BASE_SECONDS:30}
    alipay:
      app-id: ${ALIPAY_APP_ID:}
      private-key: ${ALIPAY_PRIVATE_KEY:}
      alipay-public-key: ${ALIPAY_PUBLIC_KEY:}
      seller-id: ${ALIPAY_SELLER_ID:}
      gateway-url: ${ALIPAY_GATEWAY_URL:https://openapi.alipay.com/gateway.do}
      notify-url: ${ALIPAY_NOTIFY_URL:}
      return-url: ${ALIPAY_RETURN_URL:}
      charset: ${ALIPAY_CHARSET:UTF-8}
      sign-type: ${ALIPAY_SIGN_TYPE:RSA2}
      # T+1 账单下载对账（需要商户开通对账单接口；默认关闭）
      bill:
        enabled: ${ALIPAY_BILL_ENABLED:false}
        bill-type: ${ALIPAY_BILL_TYPE:trade}
        smid: ${ALIPAY_BILL_SMID:}
        charset: ${ALIPAY_BILL_CHARSET:GBK}
        connect-timeout-ms: ${ALIPAY_BILL_CONNECT_TIMEOUT_MS:5000}
        read-timeout-ms: ${ALIPAY_BILL_READ_TIMEOUT_MS:30000}
      format: ${ALIPAY_FORMAT:json}
      connect-timeout-ms: ${ALIPAY_CONNECT_TIMEOUT_MS:5000}
      read-timeout-ms: ${ALIPAY_READ_TIMEOUT_MS:15000}

  rate-limit:
    auth:
      register:
        # 覆盖 @RateLimit 注解默认值（每 IP 每小时 10 次）
        limit: ${REGISTER_RATE_LIMIT:10}
        window-seconds: ${REGISTER_RATE_WINDOW_SECONDS:3600}
  audit:
    enabled: ${AUDIT_CLEANUP_ENABLED:true}
    retention-days: ${AUDIT_RETENTION_DAYS:180}
    batch-size: ${AUDIT_CLEANUP_BATCH_SIZE:1000}
    max-batches: ${AUDIT_CLEANUP_MAX_BATCHES:10}
    cron: ${AUDIT_CLEANUP_CRON:0 20 3 * * *}
  logging:
    # 访问日志：每条 API 请求一行；慢 SQL 默认关，本地/预发用 SLOW_SQL_ENABLED=true 打开
    access-log-enabled: ${LOG_ACCESS_ENABLED:true}
    access-log-slow-ms: ${ACCESS_LOG_SLOW_MS:1000}
    slow-sql-enabled: ${SLOW_SQL_ENABLED:false}
    slow-sql-threshold-ms: ${SLOW_SQL_THRESHOLD_MS:200}

management:
  server:
    port: ${MANAGEMENT_PORT:9091}
    address: ${MANAGEMENT_ADDRESS:127.0.0.1}
  tracing:
    enabled: ${TRACING_ENABLED:false}
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://127.0.0.1:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        readiness:
          include: db,ping,readinessState
        liveness:
          include: livenessState,ping
  metrics:
    tags:
      application: atry-base
    distribution:
      percentiles-histogram:
        http.server.requests: true
        atry.method: true
      percentiles:
        http.server.requests: 0.5,0.95,0.99

resilience4j:
  circuitbreaker:
    instances:
      redis:
        slidingWindowSize: 20
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true

# 日志输出（文件/格式/脱敏/滚动）由 logback-spring.xml 接管，这里只留级别
logging:
  level:
    com.wherelee.base: ${LOG_LEVEL_BASE:info}

springdoc:
  # 启动期预加载文档，避免首个请求承担扫描开销
  pre-loading-enabled: true
  api-docs:
    path: /v3/api-docs
    # 生产默认关闭文档端点；需要时显式 SPRINGDOC_ENABLED=true
    enabled: ${SPRINGDOC_ENABLED:true}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SPRINGDOC_ENABLED:true}
    operations-sorter: alpha
  packages-to-scan: com.wherelee.base

atry:
  demo:
    enabled: ${ATRY_DEMO_ENABLED:true}
    currency: ${ATRY_DEMO_CURRENCY:CNY}
    initial-balance: ${ATRY_DEMO_INITIAL_BALANCE:10.000000}
    default-model: ${ATRY_DEMO_MODEL:mock-small}
    default-max-tokens: ${ATRY_DEMO_MAX_TOKENS:128}
  llm:
    mock:
      delay-ms: ${ATRY_LLM_MOCK_DELAY_MS:0}
      failure-model: ${ATRY_LLM_MOCK_FAILURE_MODEL:mock-fail}
      flaky-model: ${ATRY_LLM_MOCK_FLAKY_MODEL:mock-flaky}
      slow-model: ${ATRY_LLM_MOCK_SLOW_MODEL:mock-slow}
      slow-delay-ms: ${ATRY_LLM_MOCK_SLOW_DELAY_MS:5000}
      default-max-tokens: ${ATRY_LLM_MOCK_DEFAULT_MAX_TOKENS:128}
      chunk-count: ${ATRY_LLM_MOCK_CHUNK_COUNT:8}
      chunk-delay-ms: ${ATRY_LLM_MOCK_CHUNK_DELAY_MS:10}
      mid-stream-fail-model: ${ATRY_LLM_MOCK_MID_STREAM_FAIL_MODEL:mock-stream-mid-fail}
    timeouts:
      connect-ms: ${ATRY_LLM_CONNECT_TIMEOUT_MS:5000}
      first-token-ms: ${ATRY_LLM_FIRST_TOKEN_TIMEOUT_MS:45000}
      chunk-idle-ms: ${ATRY_LLM_CHUNK_IDLE_TIMEOUT_MS:60000}
      total-ms: ${ATRY_LLM_TOTAL_TIMEOUT_MS:600000}
    retry:
      max-attempts: ${ATRY_LLM_MAX_ATTEMPTS:3}
      initial-backoff-ms: ${ATRY_LLM_INITIAL_BACKOFF_MS:300}
      max-backoff-ms: ${ATRY_LLM_MAX_BACKOFF_MS:2000}
      jitter-ratio: ${ATRY_LLM_BACKOFF_JITTER:0.2}
    circuit:
      failure-rate-threshold: ${ATRY_LLM_CIRCUIT_FAILURE_RATE:50}
      minimum-calls: ${ATRY_LLM_CIRCUIT_MIN_CALLS:20}
      open-ms: ${ATRY_LLM_CIRCUIT_OPEN_MS:30000}
      half-open-probes: ${ATRY_LLM_CIRCUIT_HALF_OPEN_PROBES:5}
      slow-call-ms: ${ATRY_LLM_CIRCUIT_SLOW_CALL_MS:0}
      slow-call-rate-threshold: ${ATRY_LLM_CIRCUIT_SLOW_CALL_RATE:60}
    rate-limit:
      # auto=有 Redis 时多实例共享令牌桶；local=仅本机；redis=强制共享（Redis 故障仍降级本地）
      backend: ${ATRY_LLM_RATE_LIMIT_BACKEND:auto}
      tenant-rpm: ${ATRY_LLM_TENANT_RPM:600}
      provider-rpm: ${ATRY_LLM_PROVIDER_RPM:6000}
      max-in-flight: ${ATRY_LLM_MAX_IN_FLIGHT:100}
    outbox:
      enabled: ${ATRY_LLM_OUTBOX_ENABLED:true}
      poll-ms: ${ATRY_LLM_OUTBOX_POLL_MS:1000}
    deepseek:
      enabled: ${DEEPSEEK_ENABLED:false}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      api-key: ${DEEPSEEK_API_KEY:}
      default-model: ${DEEPSEEK_DEFAULT_MODEL:deepseek-flash}
      thinking-disabled: ${DEEPSEEK_THINKING_DISABLED:true}
      connect-timeout-ms: ${DEEPSEEK_CONNECT_TIMEOUT_MS:5000}
      total-timeout-ms: ${DEEPSEEK_TOTAL_TIMEOUT_MS:600000}
  metering:
    expiry:
      enabled: ${ATRY_METERING_EXPIRY_ENABLED:true}
      poll-ms: ${ATRY_METERING_EXPIRY_POLL_MS:60000}
