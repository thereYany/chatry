server:
  port: ${SERVER_PORT:8090}

spring:
  application:
    name: atry-template
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/atry_template?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}

app:
  tenant:
    enforce: true
    default-tenant-id: 0
  jwt:
    secret: ${JWT_SECRET:template-demo-jwt-secret-change-before-production-2026}
    ttl-minutes: ${JWT_TTL_MINUTES:10080}
    issuer: ${JWT_ISSUER:atry}
    audience: ${JWT_AUDIENCE:atry-web}
  payment:
    provider: mock
    mock-enabled: true
    mock-secret: template-mock-secret
    order-expire-minutes: 15
    query-after-seconds: 60
    reconcile-batch-size: 50
    reconcile-interval-ms: 60000
    reconcile-initial-delay-ms: 30000
    refund-max-attempts: 5
    refund-retry-base-seconds: 30
  cos:
    bucket: ${COS_BUCKET:template-bucket}
    region: ${COS_REGION:ap-guangzhou}
    secret-id: ${COS_SECRET_ID:}
    secret-key: ${COS_SECRET_KEY:}
